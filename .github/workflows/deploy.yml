name: Build and Deploy on Pi 5

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      REMOTE_BIN: /home/akaalroopsingh/mcbot/mcbot
      REMOTE_TMP_BIN: /home/akaalroopsingh/mcbot/mcbot_new
      ENV_FILE: /home/akaalroopsingh/mcbot/.env.deploy
      REVISION: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: cargo +1.97.0 build --release

      - name: Sentry release and symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: akaalroop-singh
          SENTRY_PROJECT: mcbot
        run: |
          set -euo pipefail
          sentry-cli debug-files upload --include-sources target/release/mcbot
          sentry-cli releases new "$REVISION"
          sentry-cli releases set-commits "$REVISION" --auto
          sentry-cli releases finalize "$REVISION"

      - name: Mark Sentry deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: akaalroop-singh
          SENTRY_PROJECT: mcbot
        run: sentry-cli releases deploys "$REVISION" new -e production

      - name: Deploy and restart
        run: |
          set -euo pipefail
          install -m 755 target/release/mcbot "$REMOTE_TMP_BIN"
          mv -f "$REMOTE_TMP_BIN" "$REMOTE_BIN"

          touch "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          TMP_ENV=$(mktemp "${ENV_FILE}.XXXXXX")
          trap 'rm -f "$TMP_ENV"' EXIT
          awk '!/^REVISION=/' "$ENV_FILE" > "$TMP_ENV"
          printf 'REVISION=%s\n' "$REVISION" >> "$TMP_ENV"
          chmod 600 "$TMP_ENV"
          mv -f "$TMP_ENV" "$ENV_FILE"
          trap - EXIT

          sudo systemctl restart mcbot
